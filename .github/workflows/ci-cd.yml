name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    # A real Postgres instance for the job, not a mock - integration and
    # system tests run actual queries against actual tables, the same way
    # scripts/benchmark.js and the manual testing this pipeline replaces did.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: food_delivery_test
          POSTGRES_USER: food_delivery_app
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U food_delivery_app -d food_delivery_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PG_HOST: localhost
      PG_PORT: 5432
      PG_DATABASE: food_delivery_test
      PG_USER: food_delivery_app
      PG_PASSWORD: devpassword
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 14

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # High/critical only - low/moderate advisories in transitive dev
      # tooling shouldn't block every PR; informational, not build-breaking.
      - name: npm audit (high & critical)
        run: npm audit --audit-level=high

  docker-build:
    name: Build & Smoke-Test Container
    runs-on: ubuntu-latest
    needs: [lint-and-test]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: food_delivery
          POSTGRES_USER: food_delivery_app
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U food_delivery_app -d food_delivery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t food-delivery-backend:${{ github.sha }} ./backend

      - name: Run container against the service Postgres
        run: |
          docker run -d --name api \
            --network host \
            -e NODE_ENV=production \
            -e PG_HOST=localhost \
            -e PG_DATABASE=food_delivery \
            -e PG_USER=food_delivery_app \
            -e PG_PASSWORD=devpassword \
            -e JWT_SECRET=ci-smoke-test-secret \
            food-delivery-backend:${{ github.sha }}

      # Proves the image the CI just built actually boots, connects to
      # Postgres, and serves traffic - not just that `docker build` exited
      # 0. This is what "container deployment" means in the pipeline: the
      # artifact is validated, not just produced.
      - name: Wait for /health to report ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5001/health; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy"
          docker logs api
          exit 1

      - name: Container logs
        if: always()
        run: docker logs api

      - name: Clean up
        if: always()
        run: docker rm -f api || true
