# Render Blueprint — deploy from GitHub: Dashboard → New → Blueprint → select repo
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: foodclub-db
    plan: free
    databaseName: food_delivery
    user: food_delivery_app

services:
  # ── Backend API (Node — simpler on Render free tier than Docker) ──
  - type: web
    name: foodclub-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    preDeployCommand: node src/db/migrate.js && if [ "$RUN_SEED" = "true" ]; then node scripts/seed.js; fi
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: PG_HOST
        fromDatabase:
          name: foodclub-db
          property: host
      - key: PG_PORT
        fromDatabase:
          name: foodclub-db
          property: port
      - key: PG_DATABASE
        fromDatabase:
          name: foodclub-db
          property: database
      - key: PG_USER
        fromDatabase:
          name: foodclub-db
          property: user
      - key: PG_PASSWORD
        fromDatabase:
          name: foodclub-db
          property: password
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RUN_SEED
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: foodclub-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: foodclub-web
          envVarKey: RENDER_EXTERNAL_URL

  # ── Frontend (React static build) ──
  - type: web
    name: foodclub-web
    runtime: static
    buildCommand: chmod +x frontend/scripts/render-build.sh && ./frontend/scripts/render-build.sh
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: FOODCLUB_API_HOST
        fromService:
          type: web
          name: foodclub-api
          property: host
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false
